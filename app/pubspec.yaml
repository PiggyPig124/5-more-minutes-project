name: anxin_companion
description: Anxin Companion Android-first client for older adults and caregivers.
publish_to: "none"
version: 0.2.1+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^4.1.1
  http: ^1.2.2
  shared_preferences: ^2.5.3
  speech_to_text: ^7.4.0
  timezone: ^0.10.1
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
